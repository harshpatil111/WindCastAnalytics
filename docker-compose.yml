
services:
  backend:
    build:
      context: ./backend
    image: windcast-backend:latest
    container_name: windcast-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: windcast-frontend:latest
    container_name: windcast-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

